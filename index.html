<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo | Conectados pela Tecnologia</title>
<style>
:root{--bg:#ececec;--panel:#fff;--ink:#1a1a1a;--soft:#6b6b6b;--line:#cfcfcf;--ph:#e2e2e2;--bar:#d2d2d2;--dark:#161616;--darkink:#fff;--red:#c8102e;--note:#fff4c2;--noteink:#5a4a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--panel:#1c1c1c;--ink:#efefef;--soft:#a0a0a0;--line:#3a3a3a;--ph:#2c2c2c;--bar:#3c3c3c;--dark:#080808;--note:#3b3200;--noteink:#ffe98a}}
:root[data-theme="dark"]{--bg:#101010;--panel:#1c1c1c;--ink:#efefef;--soft:#a0a0a0;--line:#3a3a3a;--ph:#2c2c2c;--bar:#3c3c3c;--dark:#080808;--note:#3b3200;--noteink:#ffe98a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.tools b{font-size:14px}.tools small{color:var(--soft);display:block;font-size:12px}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.grp button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;border-radius:6px}
.grp button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stage{padding:24px 12px 60px;display:flex;justify-content:center}
.frame{width:100%;max-width:1100px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12);transition:max-width .25s}
.frame.mob{max-width:390px}
.chrome{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--bar);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--soft);opacity:.5}
.chrome span{margin-left:8px;font-size:12px;color:var(--soft);background:var(--panel);padding:2px 10px;border-radius:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* wireframe pieces */
.sec{position:relative;padding:44px 32px;border-bottom:1px dashed var(--line)}
.sec.dk{background:var(--dark);color:var(--darkink)}.sec.gr{background:var(--ph)}.sec.rd{background:var(--red);color:#fff}
.mob .sec{padding:28px 16px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:8px}
.mob .nav{padding:12px 16px}
.logo{font-weight:700;font-size:14px}
.menu{display:flex;gap:18px}
.menu a{font-size:13px;color:var(--soft);cursor:pointer;padding:6px 0;border-bottom:3px solid transparent}
.menu a.on{color:var(--ink);font-weight:600;border-color:var(--red)}
.mob .menu{gap:12px}.mob .menu a{font-size:12px}
.tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:700;margin-bottom:10px}
.dk .tag{color:#ff6b7e}.rd .tag{color:#fff}
.h1{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-bottom:14px;max-width:560px}
.mob .h1{font-size:23px}
.h2{font-size:22px;font-weight:700;margin-bottom:6px}
.h2:after{content:"";display:block;width:36px;height:3px;background:var(--red);margin-top:10px}
.rd .h2:after{background:#fff}
.mob .h2{font-size:19px}
.lines i{display:block;height:7px;background:var(--bar);border-radius:4px;margin:8px 0}
.dk .lines i{background:#3a3a3a}.rd .lines i{background:rgba(255,255,255,.5)}
.lines i:last-child{width:62%}
.grid{display:grid;gap:28px;align-items:center}
.g2{grid-template-columns:1fr 1fr}.g12{grid-template-columns:1fr 2fr}
.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr);gap:14px}
.mob .g2,.mob .g12,.mob .g3{grid-template-columns:1fr;gap:18px}.mob .g5{grid-template-columns:repeat(2,1fr)}
.ph{background:var(--ph);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:12px;text-align:center;padding:8px;position:relative;overflow:hidden}
.ph:before,.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - .5px),var(--line) 50%,transparent calc(50% + .5px))}
.ph:after{transform:scaleX(-1)}
.ph span{position:relative;z-index:1;background:var(--ph);padding:2px 6px}
.dk .ph{background:#242424;border-color:#3a3a3a}.dk .ph span{background:#242424}
.r43{aspect-ratio:4/3;border-left:6px solid var(--red)}.sq{aspect-ratio:1}.r1610{aspect-ratio:16/10}
.card{background:var(--panel);border-top:3px solid var(--red);padding:18px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.gr .card{background:var(--panel)}
.card h4{font-size:14px;margin-bottom:6px}.card .n{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--red);display:block;margin-bottom:6px}
.steps{margin-top:22px;max-width:640px}
.step{display:flex;gap:14px;padding-bottom:16px;border-left:1px solid var(--line);margin-left:16px;padding-left:24px;position:relative}
.step:last-child{border-color:transparent}
.step b{position:absolute;left:-16px;top:-2px;width:32px;height:32px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--red);font-size:13px}
.step div{flex:1}.step h4{font-size:14px}
.code{background:#1b1b1b;color:#eee;font:12px/1.7 Consolas,monospace;padding:16px;border-left:6px solid var(--red);white-space:pre;overflow-x:auto}
.code em{color:#8c8c8c;font-style:normal}
.btn{display:inline-block;background:var(--dark);color:#fff;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;border:0;font-family:inherit}
.rd .btn{background:var(--dark)}
.demo{background:#1b1b1b;border-left:6px solid var(--red);padding:20px;color:#eee}
.demo label{display:block;font-size:11px;color:#bbb;margin:8px 0 3px}
.demo input{width:100%;padding:8px 10px;background:#0e0e0e;border:1px solid #3a3a3a;color:#fff;font:inherit}
.demo .btn{background:var(--red);width:100%;margin-top:14px}
.out{margin-top:14px;background:#0e0e0e;border:1px solid #2c2c2c;padding:12px;min-height:84px;font:12px/1.6 Consolas,monospace;white-space:pre-wrap}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dk .li{border-color:#2c2c2c}.li:before{content:"";width:7px;height:7px;background:var(--red);flex:none}.li i{flex:1;height:7px;background:var(--bar);border-radius:4px}
.dk .li i{background:#3a3a3a}
.foot{background:var(--dark);color:#aaa;font-size:12px;padding:20px 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.mob .foot{padding:18px 16px}
.cta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
.center{text-align:center}.center .h2:after{margin-left:auto;margin-right:auto}.center .lines i{margin-left:auto;margin-right:auto;max-width:420px}
/* anotações */
.note{display:none;position:absolute;top:8px;right:8px;z-index:5;background:var(--note);color:var(--noteink);border:1px solid #d9b800;font-size:11px;line-height:1.35;padding:4px 8px;max-width:230px;border-radius:4px}
.fr.notes .note{display:block}
.mob .note{max-width:150px;font-size:10px}
.legend{max-width:1100px;margin:14px auto 0;font-size:12px;color:var(--soft);padding:0 4px}
</style>
</head>
<body>
<div class="tools">
  <div><b>Protótipo clicável · Conectados pela Tecnologia</b><small>Wireframe de média fidelidade. Clique no menu do site para navegar.</small></div>
  <div class="grp" id="gView"><button data-v="desk" class="on">Desktop</button><button data-v="mob">Celular</button></div>
  <div class="grp"><button id="bNotes">Anotações: desligadas</button></div>
</div>
<div class="stage"><div style="width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center">
  <div class="frame" id="frame"><div class="chrome"><i></i><i></i><i></i><span id="url">index.html</span></div><div id="page"></div></div>
  <p class="legend">Quadrados com X são imagens. Barras cinzas representam texto. Vermelho (#C8102E), preto e branco seguem a identidade do site.</p>
</div></div>

<script>
var L=function(n){return '<div class="lines">'+'<i></i>'.repeat(n||3)+'</div>'};
var PH=function(t,c){return '<div class="ph '+(c||'')+'"><span>'+t+'</span></div>'};
var N=function(t){return '<div class="note">'+t+'</div>'};
var SEC=function(c,inner,note){return '<section class="sec '+(c||'')+'">'+N(note||'')+inner+'</section>'};
var NAV=function(a){var m=[['index','Quem somos'],['fazemos','O que fazemos'],['demo','Demonstração']];
 return '<header class="nav"><span class="logo">Conectados pela Tecnologia</span><nav class="menu">'+m.map(function(x){return '<a data-go="'+x[0]+'" class="'+(a==x[0]?'on':'')+'">'+x[1]+'</a>'}).join('')+'</nav></header>'};
var FOOT='<footer class="foot"><span>Conectados pela Tecnologia</span><span>Projeto de Extensão Universitária · SESI 265</span></footer>';
var CODE='<div class="code"><em># variável</em>\nnome = "Ana"\npontos = 8\n\n<em># condição</em>\nif pontos >= 7:\n    print(nome, "foi aprovada!")\n\n<em># repetição</em>\nfor rodada in range(3):\n    print("Rodada", rodada + 1)</div>';
var STEPS=function(a){return '<div class="steps">'+a.map(function(t,i){return '<div class="step"><b>'+(i+1)+'</b><div><h4>'+t+'</h4>'+L(2)+'</div></div>'}).join('')+'</div>'};
var LIS=function(n){var s='';for(var i=0;i<n;i++)s+='<div class="li"><i></i></div>';return s};
var CARDS=function(a,k){return a.map(function(t,i){return '<div class="card">'+(k?'<span class="n">'+k[i]+'</span>':'')+'<h4>'+t+'</h4>'+L(3)+'</div>'}).join('')};

var P={
index:{url:'index.html',html:function(){return NAV('index')
 +SEC('dk','<div class="grid g2"><div><p class="tag">Projeto de Extensão · SESI 265</p><h1 class="h1">Programar está mais perto do que parece.</h1>'+L(3)+'</div>'+PH('Foto da equipe','r43')+'</div>','Abertura: fundo preto, título grande, foto com borda vermelha à esquerda')
 +SEC('','<div class="grid g12"><h2 class="h2">Quem somos</h2><div>'+L(4)+L(4)+L(3)+'</div></div>','Duas colunas: título à esquerda, 3 parágrafos à direita. Vira 1 coluna no celular')
 +SEC('gr','<h2 class="h2">Equipe</h2><div class="grid g5" style="margin-top:26px;align-items:start">'+['Leticia Vito de Oliveira','Aimée Juliana Oliveira Lima','Nicolas Souza','Yasmin Silva','Isabelli Montenegro'].map(function(n){return '<div>'+PH('Foto','sq')+'<h4 style="font-size:13px;margin:10px 0 4px">'+n+'</h4>'+L(2)+'</div>'}).join('')+'</div>','Grade de 5 pessoas (3 no tablet, 2 no celular). Foto quadrada, nome e função')
 +FOOT}},
fazemos:{url:'o-que-fazemos.html',html:function(){return NAV('fazemos')
 +SEC('dk','<p class="tag">O que fazemos</p><h1 class="h1">Um primeiro contato com a programação, do jeito certo.</h1>'+L(2),'Capa com imagem de fundo escurecida')
 +SEC('','<div class="grid g2"><div><h2 class="h2" style="margin-bottom:18px">Nossa proposta</h2>'+L(4)+L(4)+L(3)+'</div>'+PH('Alunos em atividade','r43')+'</div>','Texto + imagem lado a lado')
 +SEC('gr','<h2 class="h2">Três frentes de trabalho</h2><div class="grid g3" style="margin-top:24px;align-items:stretch">'+CARDS(['Aprender','Praticar','Jogar'],['01','02','03'])+'</div>','Três cartões com número, título e descrição')
 +SEC('','<h2 class="h2">Como será o dia da atividade</h2>'+STEPS(['Apresentação da equipe e do projeto','Aula introdutória sobre tecnologia','Conceitos básicos de programação','Atividade prática','Quiz','Gincana','Conversa final']),'Linha do tempo vertical com 7 etapas numeradas')
 +SEC('dk','<div class="grid g2"><div><h2 class="h2">O que os alunos vão aprender</h2>'+L(2)+LIS(3)+'</div>'+CODE+'</div>','Bloco escuro: lista de conceitos + exemplo de código em Python')
 +SEC('','<div class="grid g2">'+PH('Estudante programando','r43')+'<div><h2 class="h2" style="margin-bottom:18px">Conhecendo o curso de ADS</h2>'+L(4)+LIS(4)+'</div></div>','Faixa invertida: imagem à esquerda, texto à direita')
 +SEC('gr','<h2 class="h2">Quiz e gincana</h2><div class="grid g2" style="margin-top:24px;align-items:stretch">'+['Quiz','Gincana'].map(function(t){return '<div class="card" style="padding:0;border-top:0">'+PH('Foto: '+t.toLowerCase(),'r1610')+'<div style="padding:16px;border-bottom:3px solid var(--red)"><h4>'+t+'</h4>'+L(3)+'</div></div>'}).join('')+'</div>','Dois quadros com foto, título e descrição')
 +SEC('','<div class="grid g12"><h2 class="h2">Material de apoio</h2><div>'+L(3)+L(3)+'</div></div>','Mesmo layout de "Quem somos"')
 +SEC('rd','<div class="cta"><div><h2 class="h2">Veja como será a demonstração</h2>'+L(1)+'</div><a class="btn" data-go="demo">Ir para a demonstração</a></div>','Chamada final: botão leva à página Demonstração (clique!)')
 +FOOT}},
demo:{url:'demonstracao.html',html:function(){return NAV('demo')
 +SEC('dk','<p class="tag">Demonstração para a turma</p><h1 class="h1">Vamos ver a programação funcionando.</h1>'+L(2),'Capa com imagem de fundo escurecida')
 +SEC('','<h2 class="h2">Três ideias para começar</h2><div class="grid g3" style="margin-top:24px;align-items:stretch">'+CARDS(['Guardar informações','Tomar decisões','Fazer várias vezes'],['VARIÁVEL','CONDIÇÃO','REPETIÇÃO'])+'</div>','Três cartões: variável, condição, repetição')
 +SEC('dk','<div class="grid g2" style="align-items:start"><div><h2 class="h2" style="margin-bottom:16px">Teste você mesmo</h2>'+L(4)+CODE+'</div><div class="demo"><label>Nome</label><input id="dn" placeholder="Digite um nome"><label>Pontuação (0 a 10)</label><input id="dp" type="number" value="8"><label>Número de rodadas</label><input id="dr" type="number" value="3"><button class="btn" id="dgo">Executar programa</button><div class="out" id="dout">A resposta do programa aparece aqui.</div></div></div>','Exemplo interativo: preencha e clique em Executar (funciona no protótipo)')
 +SEC('','<h2 class="h2">Atividade prática</h2>'+STEPS(['Abrir o VS Code','Criar a primeira página em HTML','Abrir a página no navegador','Criar o estilo em CSS','Personalizar a página','Testar e ajustar']),'Passo a passo da atividade com 6 etapas')
 +SEC('rd center','<p class="tag">Próxima etapa</p><h2 class="h2">Agora vai começar o quiz e a gincana</h2>'+L(3),'Faixa vermelha centralizada avisando a próxima etapa')
 +SEC('gr','<h2 class="h2">Regras e observações</h2><div class="grid g2" style="margin-top:24px;align-items:stretch">'+['Quiz','Gincana'].map(function(t){return '<div class="card"><h4 style="font-size:16px;margin-bottom:8px">'+t+'</h4>'+LIS(6)+'</div>'}).join('')+'</div><div class="card" style="margin-top:24px;border-top:1px solid var(--line);border-left:6px solid var(--dark)"><h4 style="font-size:16px;margin-bottom:8px">Observações gerais</h4>'+LIS(6)+'</div>','Regras em dois cartões e observações gerais em destaque embaixo')
 +FOOT}}
};

var page=document.getElementById('page'),frame=document.getElementById('frame'),urlEl=document.getElementById('url');
function go(k){var p=P[k];page.innerHTML=p.html();urlEl.textContent=p.url;window.scrollTo(0,0);
 try{history.replaceState(null,'','#'+k)}catch(e){}
 var b=document.getElementById('dgo');if(b)b.onclick=run}
function run(){var n=document.getElementById('dn').value.trim()||'Aluno',p=Number(document.getElementById('dp').value),r=Number(document.getElementById('dr').value),o=document.getElementById('dout');
 if(isNaN(p)||p<0||p>10){o.textContent='A pontuação precisa estar entre 0 e 10.';return}
 if(isNaN(r)||r<1||r>10){o.textContent='O número de rodadas precisa estar entre 1 e 10.';return}
 var t=p>=7?n+' foi aprovado(a)!\n\n':n+' vai tentar de novo.\n\n';for(var i=1;i<=r;i++)t+='Rodada '+i+'\n';o.textContent=t}
document.addEventListener('click',function(e){var a=e.target.closest('[data-go]');if(a)go(a.dataset.go)});
document.getElementById('gView').onclick=function(e){var v=e.target.dataset.v;if(!v)return;
 frame.classList.toggle('mob',v=='mob');[].forEach.call(this.children,function(b){b.classList.toggle('on',b.dataset.v==v)})};
var nb=document.getElementById('bNotes');
nb.onclick=function(){var on=frame.classList.toggle('notes');nb.textContent='Anotações: '+(on?'ligadas':'desligadas');nb.classList.toggle('on',on)};
frame.classList.add('fr');
var h=(location.hash||'').replace('#','');go(P[h]?h:'index');
</script>
</body>
</html>
